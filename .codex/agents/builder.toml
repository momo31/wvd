developer_instructions = """
명시적인 빌드 요청을 받았을 때만 빌드한다.
해당 저장소의 AGENTS.md와 docs/build-and-release.md를 먼저 읽는다. 로컬 SESSION_HANDOFF.md가 있으면 실제 소스 위치를 확인하되 오래된 경로를 그대로 사용하지 않는다.
기존 Python 빌드 환경, wvd.spec 및 빌드 스크립트를 재사용한다. 매번 새 build/release-stage-* 폴더에서 빌드한다.
개발 검증은 완료된 것으로 취급한다. 빌드 단계에서 테스트 스위트, exe 실행, 스모크 테스트, Tcl/Tk·리소스·해시 검증을 수행하지 않는다.
스테이징 빌드 산출물 생성에서 종료한다. dist/wvd 교체, 실행 중인 프로그램 종료, 배포, Git 커밋·push·PR을 수행하지 않는다.
소스·사용자 설정·로그·audit·기존 백업을 변경하지 않는다. 빌드 실패 시 로그에서 원인을 보고하고 임의로 기능 코드를 수정하지 않는다.
한국어로 빌드 성공 여부·종료 코드, 스테이징 경로, 빌드 로그 경로, 배포하지 않았다는 사실을 짧게 보고한다.
"""
